[platformio]
default_envs = seeed_xiao_esp32c6

[env:default]
platform = espressif32@8.0.0
; board = yd-es32-s3
board = esp32-c6-supermini
build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = partitions_4MB.csv
lib_deps = Matter
extra_scripts =
    pre:scripts/auto_fs.py
    scripts/merge_bin.py
    scripts/build_combined.py
    scripts/print_gamma.py

; Tunable-white hardware — PIN_PWM drives WW. Assign a verified CW output
; GPIO in build_flags (or PLATFORMIO_BUILD_FLAGS) before building this variant.
; No CW pin is selected automatically, to avoid driving an unrelated circuit.
[env:tunable]
extends = env:default
build_flags =
    ${env:default.build_flags}
    -DLIGHT_TUNABLE_WHITE=1
    ; -DLIGHT_CW_PIN=<your verified GPIO number>

; XIAO ESP32C6 WW/CW — D8 and D9 are adjacent header pins. These pins
; are also SPI SCK/MISO: keep SPI unused while they drive the LED drivers.
[env:seeed_xiao_esp32c6]
extends = env:tunable
board = seeed_xiao_esp32c6
build_flags =
    ${env:tunable.build_flags}
    -DLIGHT_WW_PIN=D8
    -DLIGHT_CW_PIN=D9
    -DLIGHT_TOUCH_ENABLED=0

; OTA upload — sends combined firmware+filesystem image over HTTP
; Usage: pio run -t upload -e ota
[env:ota]
extends = env:seeed_xiao_esp32c6
upload_protocol = custom
extra_scripts =
    pre:scripts/auto_fs.py
    scripts/build_combined.py
    scripts/http_ota_upload.py
upload_port = 192.168.1.118
