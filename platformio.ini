[platformio]
default_envs = default

[env:default]
platform = espressif32@8.0.0
; board = yd-es32-s3
board = esp32-c6-supermini
build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = partitions_4MB.csv
lib_deps = Matter
extra_scripts =
    pre:scripts/auto_fs.py
    scripts/merge_bin.py
    scripts/build_combined.py
    scripts/print_gamma.py

; OTA upload — sends combined firmware+filesystem image over HTTP
; Usage: pio run -t upload -e ota
[env:ota]
extends = env:default
upload_protocol = custom
extra_scripts =
    pre:scripts/auto_fs.py
    scripts/build_combined.py
    scripts/http_ota_upload.py
upload_port = 192.168.1.113
